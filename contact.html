<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테크케이 | CONTACT - Coming Soon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        body { 
            font-family: 'Pretendard', sans-serif; 
            background-color: #050a14; 
            color: #ffffff; 
            margin: 0; 
            min-height: 100vh;
        }
        
        /* 로딩 애니메이션 */
        .loader-ring {
            border: 3px solid rgba(6, 182, 212, 0.1);
            border-top: 3px solid #06b6d4;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1.5s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 마우스 광원 효과 초기 위치 수정 */
        #mouse-glow {
            position: fixed;
            top: -500px;
            left: -500px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(6, 182, 212, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1;
            filter: blur(80px);
        }

        /* 콘텐츠를 마우스 효과보다 위로 */
        .content-layer {
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="mouse-glow"></div>

    <nav class="fixed w-full z-50 flex justify-between items-center px-6 md:px-10 py-6 bg-black/60 backdrop-blur-lg border-b border-white/5 content-layer">
        <a href="index.html" class="text-2xl font-black tracking-tighter text-cyan-500 hover:text-cyan-400 transition-colors">
            TECH K
        </a>
        <div class="space-x-4 md:space-x-8 font-bold text-sm">
            <a href="index.html" class="hover:text-cyan-400">HOME</a>
            <a href="about.html" class="hover:text-cyan-400">COMPANY</a>
            <a href="business.html" class="hover:text-cyan-400">BUSINESS</a>
            <a href="contact.html" class="text-cyan-400 border-b-2 border-cyan-500 pb-1">CONTACT</a>
        </div>
    </nav>

    <main class="content-layer min-h-screen flex flex-col items-center justify-center px-6 text-center">
        <div class="mb-10">
            <div class="loader-ring mx-auto mb-10"></div>
            <h1 class="text-5xl md:text-7xl font-black mb-6 tracking-tighter leading-tight">
                준비 중입니다
            </h1>
            <p class="text-gray-400 text-lg md:text-xl max-w-2xl mx-auto leading-relaxed">
                현재 <span class="text-cyan-400 font-bold">CONTACT</span> 페이지를 리뉴얼하고 있습니다.<br>
                문의 사항은 대표 번호로 연락 주시면 상세히 안내해 드리겠습니다.
            </p>
        </div>

        <div class="bg-white/5 backdrop-blur-md border border-white/10 p-8 rounded-3xl grid md:grid-cols-2 gap-8 text-left max-w-3xl w-full">
            <div>
                <p class="text-cyan-500 font-bold mb-1 text-xs uppercase tracking-widest">Main Office</p>
                <p class="text-gray-200">전주시 덕진구 만성북로 51-25,<br>3층 3064호</p>
            </div>
            <div>
                <p class="text-cyan-500 font-bold mb-1 text-xs uppercase tracking-widest">Contact Info</p>
                <p class="text-gray-200">Tel: 070-4348-5941</p>
                <p class="text-gray-200">Fax: 070-4324-5942</p>
            </div>
        </div>

        <a href="index.html" class="mt-12 text-sm font-bold text-gray-500 hover:text-cyan-400 transition-colors">
            ← 메인으로 돌아가기
        </a>
    </main>

   <style>
    .star {
        position: fixed;
        background-color: #fff;
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
        animation: fadeOutStar 1.5s forwards;
        z-index: 9998; /* 커서보다 살짝 아래, 배경 광원보다 위 */
    }

    @keyframes fadeOutStar {
        0% { transform: scale(0) translateY(0px); opacity: 1; }
        50% { transform: scale(1) translateY(-10px); opacity: 0.8; }
        100% { transform: scale(0.5) translateY(-30px); opacity: 0; }
    }
</style>

<script>
    document.addEventListener('mousemove', function(e) {
        const createStar = () => {
            const star = document.createElement('div');
            star.className = 'star';
            document.body.appendChild(star);

            const size = Math.random() * 3 + 1; // 1px to 4px
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${e.clientX + (Math.random() * 20 - 10)}px`; // 마우스 근처에 랜덤하게
            star.style.top = `${e.clientY + (Math.random() * 20 - 10)}px`; // 마우스 근처에 랜덤하게

            // 랜덤한 색상 (사이언 계열)
            const hue = Math.floor(Math.random() * 30) + 180; // 180-210 (파랑-청록)
            const saturation = Math.floor(Math.random() * 30) + 70; // 70-100%
            const lightness = Math.floor(Math.random() * 20) + 80; // 80-100%
            star.style.backgroundColor = `hsl(${hue}, ${saturation}%, ${lightness}%)`;

            star.addEventListener('animationend', () => {
                star.remove();
            });
        };

        // 마우스 움직임 횟수를 제한하여 별이 너무 많이 생성되지 않도록 함
        if (Math.random() < 0.3) { // 30% 확률로 별 생성
            createStar();
        }
    });
</script>

</body>
</html>
