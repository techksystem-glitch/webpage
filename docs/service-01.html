<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>테크케이 | SERVICE DETAIL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;700;900&display=swap');
        
        body { 
            font-family: 'Pretendard', sans-serif; 
            background: radial-gradient(circle at center, #0a192f 0%, #050a14 100%); 
            color: #ffffff; 
            margin: 0; 
            overflow-x: hidden;
        }

        /* 별 효과 스타일 */
        .star { 
            position: fixed; 
            background-color: #fff; 
            border-radius: 50%; 
            opacity: 0; 
            pointer-events: none; 
            animation: fadeOutStar 1.5s forwards; 
            z-index: 9998; 
        }
        @keyframes fadeOutStar { 
            0% { transform: scale(0) translateY(0px); opacity: 1; } 
            100% { transform: scale(0) translateY(-30px); opacity: 0; } 
        }

        /* 유리 질감 효과 */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
        }

        /* 각 서비스 헤더 배경 (기본값) */
        .hero-service-detail {
            background-image: linear-gradient(to bottom, rgba(5, 10, 20, 0.8), #050a14), 
                              url('https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&q=80'); 
            background-size: cover; 
            background-position: center; 
            height: 40vh;
        }

        /* --- 각 서비스별 맞춤 배경 (여기를 수정하세요!) --- */
       /* service-01.html (AI 솔루션) - 인공지능 신경망 느낌 */
        .hero-ai-solution {
            background-image: linear-gradient(to bottom, rgba(5, 10, 20, 0.8), #050a14), 
                              url('https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&q=80'); 
        }

        /* service-02.html (WEB/APP 플랫폼) - 깔끔한 코드/데이터 플랫폼 느낌 */
        .hero-platform {
            background-image: linear-gradient(to bottom, rgba(5, 10, 20, 0.8), #050a14), 
                              url('https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&q=80'); 
        }

        /* service-03.html (AR/VR 콘텐츠) - 가상현실/디지털 가상 공간 느낌 */
        .hero-ar-vr {
            background-image: linear-gradient(to bottom, rgba(5, 10, 20, 0.8), #050a14), 
                              url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?auto=format&fit=crop&q=80'); 
        }
        /* service-04.html (XR 실감체험) */
        .hero-xr-experience {
            background-image: linear-gradient(to bottom, rgba(5, 10, 20, 0.8), #050a14), 
                              url('https://images.unsplash.com/photo-1622979135225-d2ba269cf1ac?auto=format&fit=crop&q=80'); 
        }
        /* service-05.html (모바일 게임) */
        .hero-mobile-game {
            background-image: linear-gradient(to bottom, rgba(5, 10, 20, 0.8), #050a14), 
                              url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&q=80'); 
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas" class="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none opacity-40"></canvas>

    <nav class="fixed w-full z-50 flex justify-between items-center px-10 py-6 bg-black/40 backdrop-blur-md border-b border-white/5">
        <a href="index.html" class="text-2xl font-black tracking-tighter text-cyan-500 hover:text-cyan-400 transition-all">TECH K</a>
        <div class="space-x-8 font-bold text-sm">
            <a href="index.html" class="hover:text-cyan-400 transition-colors">HOME</a>
            <a href="about.html" class="hover:text-cyan-400 transition-colors">COMPANY</a>
            <a href="business.html" class="text-cyan-400 border-b-2 border-cyan-500 pb-1">BUSINESS</a>
            <a href="contact.html" class="hover:text-cyan-400">CONTACT</a>
        </div>
    </nav>

    <header class="hero-service-detail flex items-center justify-center pt-20">
        <div class="text-center">
            <h1 class="text-5xl font-black uppercase tracking-tighter">AI 통합 플랫폼</h1>
            <p class="text-cyan-500 mt-4 font-bold tracking-widest">Digital Twin & Interactive Content</p>
        </div>
    </header>

    <main class="container mx-auto px-6 py-20 relative z-10">
        <div class="grid lg:grid-cols-2 gap-16 items-center">
            
            <div class="glass-card overflow-hidden shadow-2xl group">
                <div class="aspect-video relative overflow-hidden">
                    <img src="PPT_이미지_파일_경로.jpg" alt="Service Image" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" onerror="this.src='https://images.unsplash.com/photo-1633167606207-d840b5070fc2?auto=format&fit=crop&q=80'">
                    <div class="absolute inset-0 bg-gradient-to-t from-[#050a14] via-transparent to-transparent opacity-60"></div>
                </div>
            </div>

            <div>
                <div class="inline-block px-4 py-1 rounded-full bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 text-xs font-bold mb-6 tracking-widest uppercase">
                    Technology Detail
                </div>
                <h2 class="text-4xl md:text-5xl font-black mb-8 leading-tight">
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-500">AI 통합 플랫폼</span> 솔루션
                </h2>
                <p class="text-gray-400 text-lg leading-relaxed mb-10">
                    내용 회의 필요
                </p>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass-card p-5 flex items-start gap-4">
                        <i class="fa-solid fa-microchip text-cyan-500 text-xl"></i>
                        <div>
                            <p class="font-bold text-white">핵심 기술</p>
                            <p class="text-xs text-gray-500 mt-1">AI & Digital Twin</p>
                        </div>
                    </div>
                    <div class="glass-card p-5 flex items-start gap-4">
                        <i class="fa-solid fa-rocket text-cyan-500 text-xl"></i>
                        <div>
                            <p class="font-bold text-white">기대 효과</p>
                            <p class="text-xs text-gray-500 mt-1">몰입감 극대화</p>
                        </div>
                    </div>
                </div>

                <div class="mt-12 flex gap-4">
                    <a href="business.html" class="px-8 py-3 bg-white text-black font-bold rounded-full hover:bg-cyan-500 hover:text-white transition-all">목록보기</a>
                    <a href="contact.html" class="px-8 py-3 border border-white/20 rounded-full font-bold hover:bg-white/5 transition-all">문의하기</a>
                </div>
            </div>
        </div>
    </main>


<style>
    .star {
        position: fixed;
        background-color: #fff;
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
        animation: fadeOutStar 1.5s forwards;
        z-index: 9998; /* 커서보다 살짝 아래, 배경 광원보다 위 */
    }

    @keyframes fadeOutStar {
        0% { transform: scale(0) translateY(0px); opacity: 1; }
        50% { transform: scale(1) translateY(-10px); opacity: 0.8; }
        100% { transform: scale(0.5) translateY(-30px); opacity: 0; }
    }
</style>

<script>
    document.addEventListener('mousemove', function(e) {
        const createStar = () => {
            const star = document.createElement('div');
            star.className = 'star';
            document.body.appendChild(star);

            const size = Math.random() * 3 + 1; // 1px to 4px
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.left = `${e.clientX + (Math.random() * 20 - 10)}px`; // 마우스 근처에 랜덤하게
            star.style.top = `${e.clientY + (Math.random() * 20 - 10)}px`; // 마우스 근처에 랜덤하게

            // 랜덤한 색상 (사이언 계열)
            const hue = Math.floor(Math.random() * 30) + 180; // 180-210 (파랑-청록)
            const saturation = Math.floor(Math.random() * 30) + 70; // 70-100%
            const lightness = Math.floor(Math.random() * 20) + 80; // 80-100%
            star.style.backgroundColor = `hsl(${hue}, ${saturation}%, ${lightness}%)`;

            star.addEventListener('animationend', () => {
                star.remove();
            });
        };

        // 마우스 움직임 횟수를 제한하여 별이 너무 많이 생성되지 않도록 함
        if (Math.random() < 0.3) { // 30% 확률로 별 생성
            createStar();
        }
    });
</script>

</body>
</html>
